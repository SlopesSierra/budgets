version: "3.8"

services:
  budgets:
    image: budgets:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6622:3000"
      - "3001:3001"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      PGHOST: your_postgres_host
      PGPORT: 5432
      PGDATABASE: budgets_app
      PGUSER: pixelpc
      PGPASSWORD: Quantize1t
    stdin_open: true
    tty: true